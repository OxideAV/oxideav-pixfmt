[package]
name = "oxideav-pixfmt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The fuzz surface here is the conversion math itself, not a byte parser.
# `convert()` trusts the caller-supplied `FrameInfo` (format / width /
# height) and the plane sizing that goes with it, so feeding raw garbage
# bytes as planes would just exercise a caller-contract violation, not a
# library bug. Instead the harness builds *well-formed* source frames for
# a fuzzer-chosen format at fuzzer-chosen (small) dimensions — including
# odd widths/heights and extra per-row stride padding — and runs every
# registered `(src, dst)` conversion against them. The contract under
# test is that a correctly-described frame never panics, integer-overflows
# (debug build), indexes out of bounds, or OOMs in any converter or its
# SIMD edge handling. This is the bug class that the historical x86_64
# AVX2 heap-corruption regression fell into, so the SIMD tail/odd-geometry
# paths are the high-value target.
[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.oxideav-pixfmt]
path = ".."

[dependencies.oxideav-core]
version = "0.1"

# Prevent this from interfering with the umbrella workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "convert_roundtrip"
path = "fuzz_targets/convert_roundtrip.rs"
test = false
doc = false
