name: Fuzz

# Daily fuzz run for the cargo-fuzz harness under fuzz/. The rich surface
# here is the conversion math, not a byte parser: convert() trusts the
# caller-supplied FrameInfo (format / width / height) and the matching
# plane layout, so the harness builds *well-formed* source frames for a
# fuzzer-chosen format at fuzzer-chosen (small) dimensions — including
# odd widths/heights and extra per-row stride padding — and runs every
# registered (src, dst) conversion against them. The contract under test
# is that a correctly-described frame never panics, integer-overflows
# (debug build), indexes out of bounds, or OOMs in any converter or its
# SIMD edge handling — the bug class the historical x86_64 AVX2
# heap-corruption regression fell into.

on:
  schedule:
    - cron: "23 5 * * *"   # daily 05:23 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
