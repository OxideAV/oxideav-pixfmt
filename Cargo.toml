[package]
name = "oxideav-pixfmt"
version = "0.1.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust pixel-format conversions, palette quantisation, and dithering — the oxideav framework's shared pixfmt layer"
repository = "https://github.com/OxideAV/oxideav-pixfmt"
homepage = "https://github.com/OxideAV/oxideav-pixfmt"
readme = "README.md"
keywords = ["multimedia", "video", "pixel-format", "color", "yuv"]
categories = ["multimedia::video", "multimedia::images"]

[features]
# Enable the `std::simd` (portable_simd) conversion path. Requires a
# nightly toolchain because `core::simd` is unstable.
nightly = []
# Pull in criterion for the benches. Kept off by default so the
# integration-test binaries do not link criterion's `alloca` native
# dependency, whose glibc allocator hooks abort the process on Linux
# (`Fatal glibc error: malloc.c sysmalloc assertion failed`). Run the
# benches with `cargo bench --features bench`.
bench = ["dep:criterion"]

[dependencies]
oxideav-core = "0.1"
criterion = { version = "0.8", optional = true }

[[bench]]
name = "yuv_rgb"
harness = false
required-features = ["bench"]

[[bench]]
name = "pixel_ops"
harness = false
required-features = ["bench"]

[[bench]]
name = "alpha"
harness = false
required-features = ["bench"]

[[bench]]
name = "depth_gray"
harness = false
required-features = ["bench"]
